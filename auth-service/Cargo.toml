[package]
name = "auth-service"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.7.4"
tokio = { version = "1.36", features = ["full"] }
# add the trace feature to tower-http
tower-http = { version = "0.5.0", features = ["fs", "cors", "trace"] }
tracing = "0.1.40"
reqwest = {version = "0.11.26", default-features= false,  features = ["json"]  }
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7.0", features = ["v4", "serde"] }

fancy-regex = "0.11" 
async-trait = "0.1.78"
validator = "0.16.1"

axum-extra = {version = "0.9.2", features =["cookie"]}

jsonwebtoken = "9.2.0"
chrono = "0.4.35"
futures = "0.3"

# load variables from .env file
dotenvy = "0.15.7"

# provide a macro for declaring lazily evaluated statics in Rust
lazy_static= "1.4.0"

rand="0.8.5"

sqlx = { version = "0.8", features = [ "runtime-tokio-rustls", "postgres", "migrate"] }

argon2 = { version = "0.5.3", features = ["std"] }


redis = { version = "0.25.2", features = ["tokio-comp"] }

thiserror = "1.0.58"
color-eyre = "0.6.3"


tracing-subscriber = { version = "0.3.18", features = ["registry", "env-filter"] }
tracing-error = "0.2.0"


secrecy = { version = "0.8.0", features = ["serde"] }

[dev-dependencies]
reqwest = {version = "0.11.26",default-features= false, features = ["json","cookies"]}
fake = "=2.3.0"
quickcheck = "0.9.2"
quickcheck_macros = "0.9.1"
test_helpers= {git="https://github.com/uriele/test_helpers.git"}